<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Patrick Jane Meme</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&display=swap"
        rel="stylesheet"
    >

    <style>
        body {
            background-color: #9e9e99;
            font-family: 'Comic Neue', sans-serif;
            margin: 0;
            overflow: hidden;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 2;
        }

        .overlay-body {
            background-color: #8e8f89;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .overlay-title {
            font-size: 24px;
            color: #4e4f43;
            margin-bottom: 16px;
        }

        .overlay-button {
            background-color: #8e8f89;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            margin: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        .overlay-button:hover {
            background-color: #8e8f89;
        }

        .scare {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            display: none;
            background-color: black;
        }

        .scare iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>

<body>

    <!-- Popup asal -->
    <div id="overlay" class="overlay">
        <div class="overlay-body">

            <p class="overlay-title">
                Do you know Patrick Jane ?
            </p>

            <button id="accept-button" class="overlay-button">
                yes XD
            </button>

            <button id="decline-button" class="overlay-button">
                Nope
            </button>

        </div>
    </div>

    <!-- Video -->
    <div id="scare" class="scare">

        <iframe
            id="video"
            src=""
            allow="autoplay; fullscreen"
            allowfullscreen>
        </iframe>

    </div>

    <script>

        const overlay = document.getElementById("overlay");
        const scare = document.getElementById("scare");
        const video = document.getElementById("video");

        const acceptButton =
            document.getElementById("accept-button");

        const declineButton =
            document.getElementById("decline-button");


        function startVideo() {

            // Hilangkan popup
            overlay.style.display = "none";

            // Paparkan video
            scare.style.display = "block";

            // Load video Streamable + autoplay
            video.src =
                "https://streamable.com/e/zy5e9x?autoplay=1&loop=1";
        }


        // Kedua-dua button memainkan video
        acceptButton.addEventListener(
            "click",
            startVideo
        );

        declineButton.addEventListener(
            "click",
            startVideo
        );

    </script>

</body>

</html>
