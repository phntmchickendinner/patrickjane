<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Patrick Jane Meme</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        .video-container {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
        }

        .video-container iframe {
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
        }
    </style>
</head>

<body>

    <div class="video-container">

        <iframe
            src="https://streamable.com/e/zy5e9x?autoplay=1&loop=1"
            title="Patrick Jane Video"
            allow="autoplay; fullscreen"
            allowfullscreen>
        </iframe>

    </div>

</body>

</html>
